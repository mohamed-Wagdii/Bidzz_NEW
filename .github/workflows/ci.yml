name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ------------------------------------------
  # Job 1: Build Back-end Docker Image
  # ------------------------------------------
  build-backend:
    name: Build Back-end
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build back-end Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./BIDZ/back-end
          file: ./BIDZ/back-end/Dockerfile
          push: false
          tags: bidz-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------
  # Job 2: Lint + Build Front-end Docker Image
  # ------------------------------------------
  build-frontend:
    name: Lint and Build Front-end
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: BIDZ/Front-end/package-lock.json

      - name: Install dependencies
        working-directory: ./BIDZ/Front-end
        run: npm install --legacy-peer-deps

      - name: Run ESLint
        working-directory: ./BIDZ/Front-end
        run: npm run lint

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build front-end Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./BIDZ/Front-end
          file: ./BIDZ/Front-end/Dockerfile
          push: false
          tags: bidz-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
